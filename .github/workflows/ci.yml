name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q director.py fx lib lib2 voices tools tests
      # Every effect on a synthetic 1080p frame, plus the credit row. No footage or music needed.
      - run: python tests/test_smoke.py
